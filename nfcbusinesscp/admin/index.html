<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Modulos NFC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">

  <!-- ==================== LOGIN ==================== -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <form id="loginForm" class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-sm">
      <div class="text-center mb-6">
        <div class="w-14 h-14 mx-auto mb-2 rounded-full bg-blue-100 flex items-center justify-center">
          <i class="fa-solid fa-bolt text-blue-600 text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800">Modulos NFC</h1>
        <p class="text-gray-500 text-sm">Admin Panel Login</p>
      </div>

      <div id="dbStatus" class="mb-4 p-3 rounded-lg text-xs flex items-start gap-2 bg-gray-50 border border-gray-200 text-gray-500">
        <i id="dbStatusIcon" class="fa-solid fa-spinner fa-spin mt-0.5"></i>
        <div class="flex-1">
          <div id="dbStatusTitle" class="font-semibold text-gray-700">Checking database.json...</div>
          <div id="dbStatusMsg" class="mt-0.5">Please wait</div>
        </div>
        <button type="button" onclick="checkDb()" title="Re-check" class="text-gray-400 hover:text-blue-600">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>

      <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
      <div class="relative mb-3">
        <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
        <input id="username" type="text" required autocomplete="username" disabled
          class="w-full border border-gray-300 rounded-lg pl-9 pr-3 py-2 focus:ring-2 focus:ring-blue-500 outline-none disabled:bg-gray-100"
          placeholder="Enter username"/>
      </div>

      <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <div class="relative mb-4">
        <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
        <input id="password" type="password" required autocomplete="current-password" disabled
          class="w-full border border-gray-300 rounded-lg pl-9 pr-10 py-2 focus:ring-2 focus:ring-blue-500 outline-none disabled:bg-gray-100"
          placeholder="Enter password"/>
        <button type="button" onclick="togglePass()" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 px-1">
          <i id="passEye" class="fa-solid fa-eye text-sm"></i>
        </button>
      </div>

      <button type="submit" id="loginBtn" disabled
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-semibold py-2.5 rounded-lg transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i>
        <span id="loginBtnText">Login</span>
      </button>
      <p id="loginError" class="text-red-500 text-sm text-center mt-3 hidden"></p>
    </form>
  </div>

  <!-- ==================== DASHBOARD ==================== -->
  <div id="dashboardScreen" class="hidden">
    <header class="bg-slate-900 text-white px-6 py-3 flex justify-between items-center sticky top-0 z-40">
      <h1 class="font-bold flex items-center gap-2">
        <i class="fa-solid fa-bolt text-yellow-400"></i> Modulos NFC Admin
      </h1>
      <div class="flex items-center gap-4">
        <span id="adminName" class="text-sm text-slate-300"></span>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded-lg text-sm flex items-center gap-1.5">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </header>

    <main class="max-w-6xl mx-auto p-6">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-gray-800">Businesses</h2>
        <button onclick="openForm()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> Add Business
        </button>
      </div>
      <div id="cardsList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
        <p class="text-gray-400">Loading...</p>
      </div>
    </main>
  </div>

  <!-- ==================== FORM ==================== -->
  <div id="formModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 id="formTitle" class="text-xl font-bold">New Business</h2>
        <button onclick="closeForm()" class="text-gray-400 hover:text-gray-700 text-2xl leading-none">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="space-y-3">
        <!-- QR ID (manual) -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">
            QR ID / Folder Name <span class="text-red-500">*</span>
          </label>
          <input id="bizId" placeholder="e.g. 93" class="w-full border p-2.5 rounded-lg"/>
          <p id="idHint" class="text-[11px] text-gray-400 mt-1">
            Ye folder banega: <code class="bg-gray-100 px-1 rounded">nfcbusinesscp/{id}/</code>
          </p>
        </div>

        <input id="bizName"  placeholder="Business Name *" class="w-full border p-2.5 rounded-lg"/>
        <input id="bizPhone" placeholder="Phone" class="w-full border p-2.5 rounded-lg"/>
        <input id="bizWa"    placeholder="WhatsApp (e.g. 919876543210)" class="w-full border p-2.5 rounded-lg"/>
        <input id="bizRev"   placeholder="Google Review Link" class="w-full border p-2.5 rounded-lg"/>
        <input id="bizMaps"  placeholder="Google Maps Link" class="w-full border p-2.5 rounded-lg"/>
        <input id="bizWeb"   placeholder="Website" class="w-full border p-2.5 rounded-lg"/>
        <input id="bizInsta" placeholder="Instagram URL" class="w-full border p-2.5 rounded-lg"/>
        <input id="bizFb"    placeholder="Facebook URL" class="w-full border p-2.5 rounded-lg"/>
      </div>

      <button id="saveBtn" onclick="saveBusiness()"
        class="w-full bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-lg font-semibold mt-4 flex items-center justify-center gap-2">
        <i class="fa-solid fa-check"></i> <span id="saveBtnText">Done</span>
      </button>
      <p id="formMsg" class="text-sm text-center mt-2 hidden"></p>
    </div>
  </div>

  <!-- ==================== QR ==================== -->
  <div id="qrModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 text-center max-w-xs w-full">
      <h2 class="font-bold mb-1">QR Code</h2>
      <p id="qrBizName" class="text-xs text-gray-500 mb-3"></p>
      <img id="qrImg" class="mx-auto mb-3 rounded-lg" width="240" height="240"/>
      <p id="qrLink" class="text-xs text-gray-500 break-all mb-3"></p>
      <a id="qrDownload" download="qr.png" class="block bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg mb-2">
        <i class="fa-solid fa-download mr-1"></i> Download QR
      </a>
      <a id="qrOpen" target="_blank" class="block bg-slate-800 hover:bg-slate-900 text-white py-2 rounded-lg mb-2">
        <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> Open Page
      </a>
      <button onclick="document.getElementById('qrModal').classList.add('hidden')"
        class="w-full text-gray-500 text-sm">Close</button>
    </div>
  </div>

<script>
// ==================== CONFIG ====================
const SESSION_KEY   = 'modulos_admin_session';
const DB_PATH       = '../../datas/database.json';
const TEMPLATE_PATH = '../../template.html';
const BRANCH        = 'main';

let session = null, editingId = null, dbCache = null, templateCache = null;

// ==================== BOOT ====================
(function boot() {
  const s = sessionStorage.getItem(SESSION_KEY);
  if (s) { session = JSON.parse(s); showDashboard(); }
  else   { showLogin(); checkDb(); }
})();

function showLogin() {
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('dashboardScreen').classList.add('hidden');
}
function showDashboard() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('dashboardScreen').classList.remove('hidden');
  document.getElementById('adminName').textContent = '@' + session.username;
  loadBusinesses();
}
function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  session = null; dbCache = null; templateCache = null;
  showLogin(); checkDb();
}

// ==================== DB STATUS ====================
function setDbStatus(state, title, msg) {
  const box  = document.getElementById('dbStatus');
  const icon = document.getElementById('dbStatusIcon');
  const ttl  = document.getElementById('dbStatusTitle');
  const m    = document.getElementById('dbStatusMsg');
  const btn  = document.getElementById('loginBtn');
  const user = document.getElementById('username');
  const pass = document.getElementById('password');

  ttl.textContent = title;
  m.textContent   = msg;
  box.className = 'mb-4 p-3 rounded-lg text-xs flex items-start gap-2 border';

  if (state === 'checking') {
    box.classList.add('bg-gray-50','border-gray-200','text-gray-500');
    icon.className = 'fa-solid fa-spinner fa-spin mt-0.5';
    btn.disabled = user.disabled = pass.disabled = true;
    btn.classList.add('bg-gray-400');
  } else if (state === 'ok') {
    box.classList.add('bg-green-50','border-green-200','text-green-700');
    icon.className = 'fa-solid fa-circle-check mt-0.5 text-green-600';
    btn.disabled = user.disabled = pass.disabled = false;
    btn.classList.remove('bg-gray-400');
  } else {
    box.classList.add('bg-red-50','border-red-200','text-red-700');
    icon.className = 'fa-solid fa-circle-xmark mt-0.5 text-red-600';
    btn.disabled = user.disabled = pass.disabled = true;
    btn.classList.add('bg-gray-400');
  }
}

async function checkDb() {
  setDbStatus('checking', 'Checking database.json...', 'Please wait');
  try {
    let res;
    try { res = await fetch(DB_PATH + '?t=' + Date.now()); }
    catch (_) { return setDbStatus('error', 'Network error', 'database.json fetch nahi hua.'); }

    if (!res.ok) {
      if (res.status === 404) return setDbStatus('error', 'File not found (404)', 'datas/database.json repo me nahi hai.');
      return setDbStatus('error', 'Load error ' + res.status, 'database.json load nahi ho payi.');
    }

    let db;
    try { db = await res.json(); }
    catch (_) { return setDbStatus('error', 'Invalid JSON', 'database.json me syntax error hai.'); }

    const admin = db && db.admin;
    if (!admin || typeof admin !== 'object')
      return setDbStatus('error', 'admin section missing', 'database.json me "admin" object nahi mila.');
    if (!admin.username || !admin.password)
      return setDbStatus('error', 'Login fields missing', 'admin.username ya admin.password missing hai.');
    if (!admin.github_token || !admin.github_owner || !admin.github_repo)
      return setDbStatus('error', 'GitHub details missing', 'admin.github_token / owner / repo missing hai.');

    setDbStatus('ok', 'Database ready', 'admin section + GitHub details mil gaye. Login karo.');
  } catch (e) {
    setDbStatus('error', 'Unexpected error', e.message);
  }
}

// ==================== LOGIN ====================
function togglePass() {
  const p = document.getElementById('password');
  const eye = document.getElementById('passEye');
  p.type = p.type === 'password' ? 'text' : 'password';
  eye.className = p.type === 'password' ? 'fa-solid fa-eye text-sm' : 'fa-solid fa-eye-slash text-sm';
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const btnTxt = document.getElementById('loginBtnText');
  const errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) return loginErr('Username aur password dono daalo');

  btn.disabled = true; btnTxt.textContent = 'Checking...';

  try {
    const res = await fetch(DB_PATH + '?t=' + Date.now());
    if (!res.ok) throw new Error('database.json load fail (' + res.status + ')');
    const db = await res.json();
    const admin = db && db.admin;
    if (!admin) throw new Error('admin section missing');
    if (username !== admin.username || password !== admin.password)
      throw new Error('Galat username ya password');

    session = {
      username: admin.username,
      token: admin.github_token,
      owner: admin.github_owner,
      repo:  admin.github_repo,
      loggedInAt: Date.now()
    };
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));

    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    btnTxt.textContent = 'Login';
    showDashboard();
  } catch (err) {
    loginErr(err.message);
    btn.disabled = false; btnTxt.textContent = 'Login';
  }
});

function loginErr(msg) {
  const el = document.getElementById('loginError');
  el.innerHTML = '<i class="fa-solid fa-circle-exclamation mr-1"></i>' + msg;
  el.classList.remove('hidden');
}

// ==================== LOAD ====================
async function loadBusinesses() {
  try {
    const res = await fetch(DB_PATH + '?t=' + Date.now());
    if (!res.ok) {
      if (res.status === 404) throw new Error('datas/database.json nahi mila (404)');
      throw new Error('Load error (' + res.status + ')');
    }
    dbCache = await res.json();
    if (!dbCache || !Array.isArray(dbCache.businesses))
      throw new Error('database.json me "businesses" array nahi mila');
    renderCards(dbCache.businesses);
  } catch (e) {
    document.getElementById('cardsList').innerHTML = `
      <div class="col-span-full bg-red-50 border border-red-200 text-red-600 rounded-xl p-4 text-sm">
        <i class="fa-solid fa-triangle-exclamation mr-2"></i>${e.message}
      </div>`;
  }
}

// ==================== CARDS ====================
function renderCards(list) {
  const box = document.getElementById('cardsList');
  if (!list.length) {
    box.innerHTML = `<p class="text-gray-400">Koi business nahi. "+ Add Business" dabao.</p>`;
    return;
  }
  box.innerHTML = list.map(b => `
    <div class="bg-white rounded-xl shadow p-5">
      <div class="flex justify-between items-start mb-3">
        <div>
          <h3 class="font-bold text-lg leading-tight">${esc(b.name)}</h3>
          <p class="text-xs text-gray-400 mt-0.5">ID: ${esc(b.id)}</p>
        </div>
        <span class="bg-blue-50 text-blue-600 text-[10px] font-semibold px-2 py-0.5 rounded-full uppercase">Live</span>
      </div>

      <div class="space-y-1.5 text-sm mb-4">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-phone text-gray-400 w-4 text-xs"></i>
          ${b.phone ? `<a href="tel:${escapeAttr(b.phone)}" class="text-gray-700 hover:text-blue-600">${esc(b.phone)}</a>` : `<span class="text-gray-300">No phone</span>`}
        </div>
        <div class="flex items-center gap-2">
          <i class="fa-brands fa-whatsapp text-green-500 w-4 text-xs"></i>
          ${b.wa ? `<a href="https://wa.me/${escapeAttr(b.wa.replace(/\D/g,''))}" target="_blank" class="text-gray-700 hover:text-green-600">${esc(b.wa)}</a>` : `<span class="text-gray-300">No WhatsApp</span>`}
        </div>
        <div class="flex items-center gap-2">
          <i class="fa-brands fa-google text-yellow-500 w-4 text-xs"></i>
          ${b.rev ? `<a href="${escapeAttr(b.rev)}" target="_blank" class="text-gray-700 hover:text-yellow-600 truncate">Review Link</a>` : `<span class="text-gray-300">No review link</span>`}
        </div>
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-location-dot text-red-500 w-4 text-xs"></i>
          ${b.maps ? `<a href="${escapeAttr(b.maps)}" target="_blank" class="text-gray-700 hover:text-red-600 truncate">Maps</a>` : `<span class="text-gray-300">No maps</span>`}
        </div>
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-globe text-blue-500 w-4 text-xs"></i>
          ${b.web ? `<a href="${escapeAttr(b.web)}" target="_blank" class="text-gray-700 hover:text-blue-600 truncate">${esc(b.web)}</a>` : `<span class="text-gray-300">No website</span>`}
        </div>
      </div>

      <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
        ${b.insta ? `<a href="${escapeAttr(b.insta)}" target="_blank" title="Instagram" class="w-8 h-8 rounded-full bg-pink-50 text-pink-600 flex items-center justify-center hover:bg-pink-100"><i class="fa-brands fa-instagram text-sm"></i></a>` : `<span class="w-8 h-8 rounded-full bg-gray-50 text-gray-300 flex items-center justify-center"><i class="fa-brands fa-instagram text-sm"></i></span>`}
        ${b.fb ? `<a href="${escapeAttr(b.fb)}" target="_blank" title="Facebook" class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center hover:bg-blue-100"><i class="fa-brands fa-facebook-f text-sm"></i></a>` : `<span class="w-8 h-8 rounded-full bg-gray-50 text-gray-300 flex items-center justify-center"><i class="fa-brands fa-facebook-f text-sm"></i></span>`}
        ${b.wa ? `<a href="https://wa.me/${escapeAttr(b.wa.replace(/\D/g,''))}" target="_blank" title="WhatsApp" class="w-8 h-8 rounded-full bg-green-50 text-green-600 flex items-center justify-center hover:bg-green-100"><i class="fa-brands fa-whatsapp text-sm"></i></a>` : `<span class="w-8 h-8 rounded-full bg-gray-50 text-gray-300 flex items-center justify-center"><i class="fa-brands fa-whatsapp text-sm"></i></span>`}
        ${b.web ? `<a href="${escapeAttr(b.web)}" target="_blank" title="Website" class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center hover:bg-blue-100"><i class="fa-solid fa-globe text-sm"></i></a>` : `<span class="w-8 h-8 rounded-full bg-gray-50 text-gray-300 flex items-center justify-center"><i class="fa-solid fa-globe text-sm"></i></span>`}
      </div>

      <div class="flex gap-2 flex-wrap">
        <button onclick="viewCard('${b.id}')" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 py-1.5 rounded">
          <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i>Open
        </button>
        <button onclick="showQR('${b.id}', '${esc(b.name)}')" class="bg-purple-600 hover:bg-purple-700 text-white text-xs px-3 py-1.5 rounded">
          <i class="fa-solid fa-qrcode mr-1"></i>QR
        </button>
        <button onclick="editBusiness('${b.id}')" class="bg-yellow-500 hover:bg-yellow-600 text-white text-xs px-3 py-1.5 rounded">
          <i class="fa-solid fa-pen mr-1"></i>Edit
        </button>
        <button onclick="deleteBusiness('${b.id}')" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded">
          <i class="fa-solid fa-trash mr-1"></i>Delete
        </button>
      </div>
    </div>
  `).join('');
}

// ==================== FORM ====================
function openForm() {
  editingId = null;
  document.getElementById('formTitle').textContent = 'New Business';
  ['bizId','bizName','bizPhone','bizWa','bizRev','bizMaps','bizWeb','bizInsta','bizFb']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('bizId').disabled = false;
  document.getElementById('formMsg').classList.add('hidden');
  document.getElementById('formModal').classList.remove('hidden');
  updateIdHint();
}
function closeForm() { document.getElementById('formModal').classList.add('hidden'); }

function updateIdHint() {
  const id = document.getElementById('bizId').value.trim() || '{id}';
  document.getElementById('idHint').innerHTML =
    `Ye folder banega: <code class="bg-gray-100 px-1 rounded">nfcbusinesscp/${esc(id)}/</code>`;
}

// live update hint
document.getElementById('bizId').addEventListener('input', updateIdHint);

function editBusiness(id) {
  const b = dbCache.businesses.find(x => x.id === id);
  if (!b) return;
  editingId = id;
  document.getElementById('formTitle').textContent = 'Edit Business';
  document.getElementById('bizId').value = b.id || '';
  document.getElementById('bizId').disabled = true;   // edit me ID change nahi
  document.getElementById('bizName').value  = b.name  || '';
  document.getElementById('bizPhone').value = b.phone || '';
  document.getElementById('bizWa').value    = b.wa    || '';
  document.getElementById('bizRev').value   = b.rev   || '';
  document.getElementById('bizMaps').value  = b.maps  || '';
  document.getElementById('bizWeb').value   = b.web   || '';
  document.getElementById('bizInsta').value = b.insta || '';
  document.getElementById('bizFb').value    = b.fb    || '';
  updateIdHint();
  document.getElementById('formModal').classList.remove('hidden');
}

// ==================== SAVE ====================
async function saveBusiness() {
  const msg = document.getElementById('formMsg');
  const saveBtnText = document.getElementById('saveBtnText');

  const name = document.getElementById('bizName').value.trim();
  const manualId = document.getElementById('bizId').value.trim();

  if (!name) {
    msg.textContent = 'Business name zaroori hai';
    msg.className = 'text-sm text-center mt-2 text-red-500';
    msg.classList.remove('hidden');
    return;
  }

  if (!editingId && !manualId) {
    msg.textContent = 'QR ID daalo (folder name)';
    msg.className = 'text-sm text-center mt-2 text-red-500';
    msg.classList.remove('hidden');
    return;
  }

  // ID validation (folder-safe)
  if (!editingId && !/^[a-zA-Z0-9_-]+$/.test(manualId)) {
    msg.textContent = 'ID me sirf letters, numbers, - aur _ allowed hai';
    msg.className = 'text-sm text-center mt-2 text-red-500';
    msg.classList.remove('hidden');
    return;
  }

  const data = {
    name,
    phone: document.getElementById('bizPhone').value.trim(),
    wa:    document.getElementById('bizWa').value.trim(),
    rev:   document.getElementById('bizRev').value.trim(),
    maps:  document.getElementById('bizMaps').value.trim(),
    web:   document.getElementById('bizWeb').value.trim(),
    insta: document.getElementById('bizInsta').value.trim(),
    fb:    document.getElementById('bizFb').value.trim()
  };

  msg.textContent = 'Generating folder + page...';
  msg.className = 'text-sm text-center mt-2 text-blue-500';
  msg.classList.remove('hidden');
  saveBtnText.textContent = 'Saving...';

  try {
    if (!templateCache) {
      const tr = await fetch(TEMPLATE_PATH + '?t=' + Date.now());
      if (!tr.ok) throw new Error('template.html nahi mila (repo root me rakho)');
      templateCache = await tr.text();
    }

    let id;
    if (editingId) {
      id = editingId;
      const idx = dbCache.businesses.findIndex(x => x.id === id);
      dbCache.businesses[idx] = { ...dbCache.businesses[idx], ...data };
    } else {
      // duplicate ID check
      if (dbCache.businesses.some(b => String(b.id) === manualId)) {
        throw new Error('Ye ID already exists. Dusri ID daalo.');
      }
      id = manualId;
      data.id = id;
      dbCache.businesses.push(data);
    }

    const html = renderTemplate(templateCache, data);

    // ROOT/nfcbusinesscp/{id}/index.html
    await githubPutFile(`nfcbusinesscp/${id}/index.html`, html,
      `Generate card for ${name} (${id})`);
    // DB update
    await githubPutFile('datas/database.json', JSON.stringify(dbCache, null, 2),
      `Update DB (${id})`);

    msg.textContent = 'Folder nfcbusinesscp/' + id + '/ created. Page ~1 min me live.';
    msg.className = 'text-sm text-center mt-2 text-green-600';

    await loadBusinesses();
    closeForm();

    // QR auto-open
    showQR(id, name);

  } catch (e) {
    msg.textContent = 'Error: ' + e.message;
    msg.className = 'text-sm text-center mt-2 text-red-500';
  } finally {
    saveBtnText.textContent = 'Done';
  }
}

// ==================== TEMPLATE RENDER ====================
function renderTemplate(tpl, d) {
  const reviewBtn = d.rev ? `
        <a href="${escapeAttr(d.rev)}" target="_blank" class="btn-review">
          <i class="fa-brands fa-google"></i> Leave a Review
        </a>` : '';
  const callBtn = d.phone ? `
        <a href="tel:${escapeAttr(d.phone)}" class="btn btn-call">
          <i class="fa-solid fa-phone"></i> Call
        </a>` : '';
  const waBtn = d.wa ? `
        <a href="https://wa.me/${escapeAttr(d.wa.replace(/\D/g,''))}" target="_blank" class="btn btn-wa">
          <i class="fa-brands fa-whatsapp"></i> WhatsApp
        </a>` : '';
  const mapsBtn = d.maps ? `
        <a href="${escapeAttr(d.maps)}" target="_blank" class="btn btn-map">
          <i class="fa-solid fa-location-dot"></i> Maps
        </a>` : '';
  const webBtn = d.web ? `
        <a href="${escapeAttr(d.web)}" target="_blank" class="btn btn-web">
          <i class="fa-solid fa-globe"></i> Website
        </a>` : '';

  const socials = [];
  if (d.insta) socials.push(`<a href="${escapeAttr(d.insta)}" target="_blank" class="social-icon" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>`);
  if (d.fb)    socials.push(`<a href="${escapeAttr(d.fb)}" target="_blank" class="social-icon" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>`);
  if (d.wa)    socials.push(`<a href="https://wa.me/${escapeAttr(d.wa.replace(/\D/g,''))}" target="_blank" class="social-icon" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>`);
  if (d.web)   socials.push(`<a href="${escapeAttr(d.web)}" target="_blank" class="social-icon" aria-label="Website"><i class="fa-solid fa-globe"></i></a>`);

  const nameUrl = encodeURIComponent(d.name);
  const logoUrl = d.logo || `https://ui-avatars.com/api/?name=${nameUrl}&background=0047b3&color=fff`;
  const desc    = d.desc || 'Tap below to connect with us';

  return tpl
    .replaceAll('{{NAME}}', escapeHtml(d.name))
    .replaceAll('{{NAME_URL}}', nameUrl)
    .replaceAll('{{DESC}}', escapeHtml(desc))
    .replaceAll('{{LOGO}}', escapeAttr(logoUrl))
    .replaceAll('{{REVIEW_BTN}}', reviewBtn)
    .replaceAll('{{CALL_BTN}}', callBtn)
    .replaceAll('{{WA_BTN}}', waBtn)
    .replaceAll('{{MAPS_BTN}}', mapsBtn)
    .replaceAll('{{WEB_BTN}}', webBtn)
    .replaceAll('{{SOCIAL_LINKS}}', socials.join('\n        '));
}

// ==================== DELETE ====================
async function deleteBusiness(id) {
  if (!confirm('Pakka delete karna hai? Card page GitHub pe reh jayega.')) return;
  try {
    dbCache.businesses = dbCache.businesses.filter(b => b.id !== id);
    await githubPutFile('datas/database.json', JSON.stringify(dbCache, null, 2),
      `Delete business ${id}`);
    renderCards(dbCache.businesses);
  } catch (e) { alert('Delete failed: ' + e.message); }
}

// ==================== GITHUB ====================
async function githubGetFile(path) {
  const url = `https://api.github.com/repos/${session.owner}/${session.repo}/contents/${path}?ref=${BRANCH}&t=${Date.now()}`;
  const res = await fetch(url, { headers: { Authorization: `Bearer ${session.token}` } });
  if (res.status === 404) return null;
  if (res.status === 401) {
    throw new Error('GitHub token invalid/expire hai. Naya fine-grained token banao (Contents: Read & Write).');
  }
  if (!res.ok) throw new Error('GitHub read failed: ' + res.status);
  return res.json();
}

async function githubPutFile(path, contentStr, message) {
  const apiUrl = `https://api.github.com/repos/${session.owner}/${session.repo}/contents/${path}`;
  const existing = await githubGetFile(path);
  const body = {
    message,
    content: btoa(unescape(encodeURIComponent(contentStr))),
    branch: BRANCH
  };
  if (existing && existing.sha) body.sha = existing.sha;

  const put = await fetch(apiUrl, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${session.token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!put.ok) {
    const err = await put.json().catch(() => ({}));
    if (put.status === 401) throw new Error('Token invalid (401). Naya token banao.');
    if (put.status === 403) throw new Error('Permission denied (403). Token me Contents: Write hai?');
    if (put.status === 409) throw new Error('Conflict (409). Thodi der baad try karo.');
    throw new Error(err.message || ('GitHub PUT failed ' + put.status));
  }
  return put.json();
}

// ==================== CARD / QR ====================
function cardUrl(id) { return new URL(`../${id}/`, location.href).href; }
function viewCard(id) { window.open(cardUrl(id), '_blank'); }

function showQR(id, name) {
  const url = cardUrl(id);
  const qr = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encodeURIComponent(url)}`;
  document.getElementById('qrImg').src = qr;
  document.getElementById('qrLink').textContent = url;
  document.getElementById('qrDownload').href = qr;
  document.getElementById('qrOpen').href = url;
  document.getElementById('qrBizName').textContent = name || '';
  document.getElementById('qrModal').classList.remove('hidden');
}

// ==================== HELPERS ====================
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const escapeHtml = esc;
function escapeAttr(s) { return esc(s); }
