<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modulos Admin Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    .card { background: #1e293b; padding: 24px; border-radius: 16px; margin-bottom: 20px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    h2 { margin-bottom: 20px; font-weight: 700; font-size: 1.4rem; color: #60a5fa; display: flex; align-items: center; gap: 10px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
    input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; font-family: inherit; font-size: 0.95rem; }
    input:focus { outline: none; border-color: #60a5fa; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .file-input-wrapper { border: 1px dashed #475569; padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; background: rgba(15, 23, 42, 0.5); }
    .file-input-wrapper input { display: none; }
    .file-input-wrapper label { cursor: pointer; color: #60a5fa; font-weight: 600; margin: 0; font-size: 0.9rem; }
    button { padding: 14px; width: 100%; background: #0047b3; color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
    button:hover { background: #003385; }
    button:disabled { opacity: 0.7; cursor: not-allowed; }
    .notif { padding: 14px; border-radius: 10px; margin-bottom: 20px; display: none; font-weight: 600; font-size: 0.9rem; }
    .notif.success { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; display: block; }
    .notif.error { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; display: block; }
    .loader-text { font-size: 0.9rem; color: #94a3b8; text-align: center; padding: 20px; }
  </style>
</head>
<body>

  <div class="container">
    <div id="loader" class="loader-text"><i class="fas fa-spinner fa-spin"></i> Loading Database...</div>

    <!-- Login Card -->
    <div class="card" id="loginCard" style="display: none;">
      <h2><i class="fas fa-lock"></i> Admin Login</h2>
      <div id="notif" class="notif"></div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="u" placeholder="Enter username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="p" placeholder="Enter password">
      </div>
      <button onclick="doLogin()">Sign In</button>
    </div>

    <!-- Generator Card -->
    <div class="card" id="addCard" style="display: none;">
      <h2><i class="fas fa-magic"></i> Generate Business Page</h2>
      <div id="notif2" class="notif"></div>
      
      <div class="row">
        <div class="form-group"><label>Business ID *</label><input type="text" id="bizId" placeholder="e.g. mr"></div>
        <div class="form-group"><label>Business Name *</label><input type="text" id="bizName" placeholder="e.g. My Business"></div>
      </div>
      
      <div class="form-group"><label>Description</label><input type="text" id="bizDesc" placeholder="Short description..."></div>
      <div class="form-group">
        <label>Upload Logo *</label>
        <div class="file-input-wrapper">
          <label for="bizLogoFile"><i class="fas fa-cloud-upload-alt"></i> Click to upload logo</label>
          <input type="file" id="bizLogoFile" accept="image/*" onchange="document.getElementById('fileName').innerText = this.files[0].name">
          <div id="fileName" style="font-size: 0.8rem; color: #94a3b8; margin-top: 8px;"></div>
        </div>
      </div>
      <div class="form-group"><label>Google Review Link</label><input type="text" id="bizRev" placeholder="https://g.page/r/..."></div>
      <div class="row">
        <div class="form-group"><label>Phone Number</label><input type="text" id="bizPhone" placeholder="+91..."></div>
        <div class="form-group"><label>WhatsApp Number</label><input type="text" id="bizWa" placeholder="+91..."></div>
      </div>
      <div class="row">
        <div class="form-group"><label>Google Maps Link</label><input type="text" id="bizMaps" placeholder="https://maps.google.com/..."></div>
        <div class="form-group"><label>Website Link</label><input type="text" id="bizWeb" placeholder="https://..."></div>
      </div>
      <div class="row">
        <div class="form-group"><label>Instagram Link</label><input type="text" id="bizInsta" placeholder="https://instagram.com/..."></div>
        <div class="form-group"><label>Facebook Link</label><input type="text" id="bizFb" placeholder="https://facebook.com/..."></div>
      </div>
      <button onclick="generatePage()" id="saveBtn"><i class="fas fa-rocket"></i> Generate Page & Upload</button>
    </div>
  </div>

  <script>
    let db = null, config = null;

    // =======================================================
    // NAYA TOKEN YAHAN SET HAI
    // =======================================================
    const CONFIG = {
      username: "admin",
      password: "admin@10M123",
      github_token: "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", 
      github_owner: "modulosagency-web", 
      github_repo: "Modulos-Agency-"
    };
    // =======================================================

    async function init() {
      const url = `https://api.github.com/repos/${CONFIG.github_owner}/${CONFIG.github_repo}/contents/datas/database.json?t=` + Date.now();
      try {
        const res = await fetch(url, { headers: { 'Authorization': `token ${CONFIG.github_token}` } });
        if (res.ok) {
          const fileData = await res.json();
          const decodedContent = decodeURIComponent(escape(atob(fileData.content)));
          db = JSON.parse(decodedContent);
          config = db.admin; 
          config.github_token = CONFIG.github_token; 
          config.github_owner = CONFIG.github_owner; 
        } else {
          config = CONFIG;
          db = { businesses: [] };
        }
      } catch (e) {
        config = CONFIG;
        db = { businesses: [] };
      }
      document.getElementById('loader').style.display = 'none';
      document.getElementById('loginCard').style.display = 'block';
    }
    init();

    function doLogin() {
      if (document.getElementById('u').value === config.username && document.getElementById('p').value === config.password) {
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('addCard').style.display = 'block';
      } else {
        document.getElementById('notif').className = 'notif error';
        document.getElementById('notif').innerText = 'Invalid Credentials!';
        document.getElementById('notif').style.display = 'block';
      }
    }

    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    async function generatePage() {
      const btn = document.getElementById('saveBtn');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
      btn.disabled = true;

      const id = document.getElementById('bizId').value.trim();
      const name = document.getElementById('bizName').value.trim();
      const desc = document.getElementById('bizDesc').value;
      const phone = document.getElementById('bizPhone').value;
      const wa = document.getElementById('bizWa').value;
      const rev = document.getElementById('bizRev').value;
      const maps = document.getElementById('bizMaps').value;
      const web = document.getElementById('bizWeb').value;
      const insta = document.getElementById('bizInsta').value;
      const fb = document.getElementById('bizFb').value;
      const logoFile = document.getElementById('bizLogoFile').files[0];

      if(!id || !name) {
        showNotif('notif2', 'error', 'ID and Name are required!');
        btn.innerHTML = '<i class="fas fa-rocket"></i> Generate Page & Upload';
        btn.disabled = false;
        return;
      }

      const baseApi = `https://api.github.com/repos/${config.github_owner}/${config.github_repo}/contents`;
      const headers = { 'Authorization': `token ${config.github_token}`, 'Accept': 'application/vnd.github.v3+json' };

      try {
        // 1. Upload Logo
        if(logoFile) {
          const base64Logo = await getBase64(logoFile);
          const logoUrl = `${baseApi}/nfcbusinesscp/${id}/logo.png`;
          let sha = null;
          const checkRes = await fetch(logoUrl, { headers });
          if(checkRes.ok) sha = (await checkRes.json()).sha;
          
          const uploadRes = await fetch(logoUrl, {
            method: 'PUT', headers,
            body: JSON.stringify({ message: `Logo for ${id}`, content: base64Logo, ...(sha && { sha }) })
          });
          if(!uploadRes.ok) throw new Error("Logo upload failed. Check Token.");
        }

        // 2. Prepare HTML Content (Built-in Template)
        const reviewBtn = rev ? `<a href="${rev}" class="btn-review" target="_blank"><i class="fab fa-google"></i> Leave a Google Review</a>` : '';
        const callBtn = phone ? `<a href="tel:${phone}" class="btn btn-call"><i class="fas fa-phone"></i> Call Now</a>` : '';
        const waBtn = wa ? `<a href="https://wa.me/${wa}" class="btn btn-wa" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp</a>` : '';
        const mapsBtn = maps ? `<a href="${maps}" class="btn btn-map" target="_blank"><i class="fas fa-map-marker-alt"></i> Maps</a>` : '';
        const webBtn = web ? `<a href="${web}" class="btn btn-web" target="_blank"><i class="fas fa-globe"></i> Website</a>` : '';
        let socialLinks = '';
        if(insta) socialLinks += `<a href="${insta}" class="social-icon" target="_blank"><i class="fab fa-instagram"></i></a>`;
        if(fb) socialLinks += `<a href="${fb}" class="social-icon" target="_blank"><i class="fab fa-facebook-f"></i></a>`;

        const finalHtml = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${name} - Connect With Us</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .profile-card { background: #ffffff; border-radius: 28px; max-width: 420px; width: 100%; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08); text-align: center; overflow: hidden; position: relative; border: 1px solid #e2e8f0; }
    .header-banner { height: 110px; background: linear-gradient(135deg, #0047b3, #002b6b); width: 100%; }
    .logo-container { width: 110px; height: 110px; margin: -55px auto 15px; border-radius: 50%; border: 5px solid #ffffff; background: #ffffff; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    .logo-container img { width: 100%; height: 100%; object-fit: cover; }
    h1 { font-size: 1.4rem; font-weight: 800; color: #0f172a; margin-bottom: 6px; padding: 0 20px; }
    .category { font-size: 0.85rem; color: #0047b3; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .description { font-size: 0.9rem; color: #64748b; padding: 0 30px; margin-bottom: 25px; line-height: 1.5; }
    .actions-container { padding: 0 24px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
    .btn-review { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; text-decoration: none; padding: 16px; border-radius: 16px; font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3); transition: transform 0.2s; }
    .btn-review:active { transform: scale(0.97); }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 14px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: transform 0.2s; }
    .btn:active { transform: scale(0.97); }
    .btn-call { background: #eff6ff; color: #0047b3; border: 1px solid #bfdbfe; }
    .btn-wa { background: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
    .btn-map { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
    .btn-web { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
    .social-section { margin-top: 15px; padding-top: 25px; border-top: 1px solid #f1f5f9; padding-bottom: 30px; }
    .social-title { font-size: 0.8rem; color: #94a3b8; font-weight: 600; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
    .social-icons { display: flex; justify-content: center; gap: 16px; }
    .social-icon { width: 45px; height: 45px; border-radius: 50%; background: #f8fafc; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 1.2rem; text-decoration: none; border: 1px solid #e2e8f0; transition: all 0.2s; }
    .social-icon:active { background: #e2e8f0; }
    .footer-brand { font-size: 0.75rem; color: #cbd5e1; font-weight: 600; letter-spacing: 1px; padding-bottom: 20px; }
    @media (min-width: 768px) {
      .btn-review:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(245, 158, 11, 0.4); }
      .btn:hover { transform: translateY(-2px); }
      .social-icon:hover { background: #0047b3; color: white; border-color: #0047b3; }
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <div class="header-banner"></div>
    <div class="logo-container">
      <img src="logo.png" alt="${name}" onerror="this.src='https://ui-avatars.com/api/?name=${name}&background=0047b3&color=fff'">
    </div>
    <h1>${name}</h1>
    <div class="category">Verified Business</div>
    <p class="description">${desc || 'Welcome to our business.'}</p>
    <div class="actions-container">
      ${reviewBtn}
      <div class="btn-grid">
        ${callBtn}
        ${waBtn}
      </div>
      <div class="btn-grid">
        ${mapsBtn}
        ${webBtn}
      </div>
    </div>
    <div class="social-section">
      <div class="social-title">Follow Us</div>
      <div class="social-icons">${socialLinks}</div>
    </div>
    <div class="footer-brand">POWERED BY MODULOS</div>
  </div>
</body>
</html>`;

        // 3. Save index.html
        const pageUrl = `${baseApi}/nfcbusinesscp/${id}/index.html`;
        let pageSha = null;
        const checkPage = await fetch(pageUrl, { headers });
        if(checkPage.ok) pageSha = (await checkPage.json()).sha;

        const pageRes = await fetch(pageUrl, {
          method: 'PUT', headers,
          body: JSON.stringify({ message: `Generate Page for ${id}`, content: btoa(unescape(encodeURIComponent(finalHtml))), ...(pageSha && { sha: pageSha }) })
        });
        
        if(!pageRes.ok) {
          const err = await pageRes.json();
          throw new Error("Page save nahi hua: " + err.message);
        }

        // 4. Update Database
        const dbUrl = `${baseApi}/datas/database.json`;
        let dbRes = await fetch(dbUrl, { headers });
        
        let currentDb = db;
        let dbSha = null;
        
        if(dbRes.ok) {
          const dbData = await dbRes.json();
          const decodedContent = JSON.parse(decodeURIComponent(escape(atob(dbData.content))));
          currentDb = decodedContent;
          dbSha = dbData.sha;
        }

        const newBiz = { id, name, phone, wa, rev, maps, web, insta, fb };
        const existingIdx = currentDb.businesses.findIndex(b => b.id === id);
        if(existingIdx >= 0) currentDb.businesses[existingIdx] = newBiz;
        else currentDb.businesses.push(newBiz);

        await fetch(dbUrl, {
          method: 'PUT', headers,
          body: JSON.stringify({ message: `Update DB for ${id}`, content: btoa(unescape(encodeURIComponent(JSON.stringify(currentDb, null, 2)))), ...(dbSha && { sha: dbSha }) })
        });

        showNotif('notif2', 'success', `Success! Page generated for ID: ${id}`);
        document.getElementById('bizId').value = '';
        document.getElementById('bizName').value = '';

      } catch(e) { 
        showNotif('notif2', 'error', e.message); 
      } finally {
        btn.innerHTML = '<i class="fas fa-rocket"></i> Generate Page & Upload';
        btn.disabled = false;
      }
    }

    function showNotif(id, type, msg) {
      const n = document.getElementById(id);
      n.className = `notif ${type}`;
      n.innerText = msg;
      n.style.display = 'block';
      setTimeout(() => n.style.display = 'none', 7000);
    }
  </script>
</body>
</html>
