<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modulos Admin - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #0047b3;
      --primary-dark: #003385;
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --success: #10b981;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Header */
    .header { background: var(--bg-card); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .logo { font-size: 1.2rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
    .logo i { color: var(--primary); font-size: 1.5rem; }
    
    /* Container */
    .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; width: 100%; flex: 1; }
    
    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
    .stat-title { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
    .stat-value { font-size: 2rem; font-weight: 800; color: var(--primary); }
    
    /* Buttons */
    .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-family: inherit; font-size: 0.9rem; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-danger { background: var(--danger); color: white; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-light); }
    
    /* Form */
    .card { background: var(--bg-card); border-radius: 12px; padding: 25px; border: 1px solid var(--border); margin-bottom: 20px; }
    .card h2 { font-size: 1.2rem; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
    .form-group label { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-dark); color: var(--text-light); font-family: inherit; }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); }
    
    /* Table/List */
    .list-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: var(--bg-dark); border-radius: 10px; margin-bottom: 10px; border: 1px solid var(--border); }
    .list-item .info { display: flex; align-items: center; gap: 15px; }
    .list-item img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
    .list-item .name { font-weight: 600; }
    .list-item .id { font-size: 0.8rem; color: var(--text-muted); }
    
    /* Login Screen */
    .login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-dark); padding: 20px; }
    .login-box { background: var(--bg-card); padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid var(--border); text-align: center; }
    .login-box i { font-size: 3rem; color: var(--primary); margin-bottom: 20px; }
    .login-box h1 { margin-bottom: 30px; }
    
    /* Notification */
    .notif { padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; display: none; }
    .notif.error { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid var(--danger); }
    .notif.success { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid var(--success); }

    @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <i class="fas fa-cube"></i>
      <h1>Modulos Admin</h1>
      <div id="loginNotif" class="notif"></div>
      <div class="form-group" style="text-align: left;">
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="Enter username">
      </div>
      <div class="form-group" style="text-align: left;">
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="Enter password">
      </div>
      <button class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;" onclick="doLogin()">Sign In</button>
      <p style="margin-top: 15px; font-size: 0.8rem; color: var(--text-muted);">Demo: admin / admin123</p>
    </div>
  </div>

  <!-- DASHBOARD SCREEN -->
  <div id="dashboardScreen" style="display: none;">
    <div class="header">
      <div class="logo"><i class="fas fa-cube"></i> MODULOS</div>
      <button class="btn btn-outline" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <div class="container">
      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-title">Total Businesses</div>
          <div class="stat-value" id="statTotal">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-title">System Status</div>
          <div class="stat-value" style="color: var(--success); font-size: 1.2rem; margin-top: 15px;">Online <i class="fas fa-check-circle"></i></div>
        </div>
      </div>

      <div id="dashNotif" class="notif"></div>

      <!-- Add Business Form -->
      <div class="card">
        <h2><i class="fas fa-plus-circle"></i> Add New Business (Demo)</h2>
        <div class="form-grid">
          <div class="form-group">
            <label>Business ID</label>
            <input type="text" id="bizId" placeholder="e.g. 12345">
          </div>
          <div class="form-group">
            <label>Business Name *</label>
            <input type="text" id="bizName" placeholder="e.g. Cafe Coffee Day">
          </div>
          <div class="form-group">
            <label>Logo URL</label>
            <input type="text" id="bizLogo" placeholder="https://...">
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="bizPhone" placeholder="+91 9876543210">
          </div>
        </div>
        <button class="btn btn-primary" onclick="addDemoBusiness()"><i class="fas fa-save"></i> Save Business</button>
      </div>

      <!-- Business List -->
      <div class="card">
        <h2><i class="fas fa-list"></i> Registered Businesses</h2>
        <div id="bizList">
          <p style="color: var(--text-muted); font-size: 0.9rem;">No businesses added yet. Add one above.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Demo State
    let isLoggedIn = false;
    let businesses = [];

    // Check Login Status
    if(sessionStorage.getItem('modulos_demo')) {
      isLoggedIn = true;
      businesses = JSON.parse(sessionStorage.getItem('modulos_data') || '[]');
      showDashboard();
    }

    function doLogin() {
      const u = document.getElementById('loginUser').value;
      const p = document.getElementById('loginPass').value;
      const notif = document.getElementById('loginNotif');

      if(u === 'admin' && p === 'admin123') {
        isLoggedIn = true;
        sessionStorage.setItem('modulos_demo', 'true');
        showDashboard();
      } else {
        notif.className = 'notif error';
        notif.style.display = 'block';
        notif.innerText = 'Invalid username or password! (Use admin / admin123)';
      }
    }

    function logout() {
      isLoggedIn = false;
      sessionStorage.removeItem('modulos_demo');
      document.getElementById('dashboardScreen').style.display = 'none';
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPass').value = '';
    }

    function showDashboard() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('dashboardScreen').style.display = 'block';
      renderList();
    }

    function addDemoBusiness() {
      const id = document.getElementById('bizId').value.trim();
      const name = document.getElementById('bizName').value.trim();
      const logo = document.getElementById('bizLogo').value.trim();
      const phone = document.getElementById('bizPhone').value.trim();
      const notif = document.getElementById('dashNotif');

      if(!id || !name) {
        notif.className = 'notif error';
        notif.style.display = 'block';
        notif.innerText = 'Business ID and Name are required!';
        return;
      }

      const newBiz = { id, name, logo: logo || 'https://via.placeholder.com/40', phone };
      businesses.push(newBiz);
      sessionStorage.setItem('modulos_data', JSON.stringify(businesses));

      // Clear form
      document.getElementById('bizId').value = '';
      document.getElementById('bizName').value = '';
      document.getElementById('bizLogo').value = '';
      document.getElementById('bizPhone').value = '';

      notif.className = 'notif success';
      notif.style.display = 'block';
      notif.innerText = 'Business saved successfully (Demo)!';
      setTimeout(() => notif.style.display = 'none', 3000);

      renderList();
    }

    function renderList() {
      const list = document.getElementById('bizList');
      document.getElementById('statTotal').innerText = businesses.length;

      if(businesses.length === 0) {
        list.innerHTML = '<p style="color: var(--text-muted); font-size: 0.9rem;">No businesses added yet.</p>';
        return;
      }

      list.innerHTML = businesses.map(b => `
        <div class="list-item">
          <div class="info">
            <img src="${b.logo}" alt="logo">
            <div>
              <div class="name">${b.name}</div>
              <div class="id">ID: ${b.id}</div>
            </div>
          </div>
          <button class="btn btn-outline" style="padding: 6px 12px; font-size: 0.8rem;" onclick="alert('View page for ${b.id}')">View</button>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
