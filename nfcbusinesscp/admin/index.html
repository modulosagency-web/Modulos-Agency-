<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modulos Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; min-height: 100vh; padding: 20px; }
    .card { background: #1e293b; border-radius: 16px; padding: 24px; max-width: 800px; margin: 0 auto; }
    h2 { margin-bottom: 20px; }
    input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 12px; }
    button { padding: 12px 24px; background: #0047b3; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:hover { background: #003385; }
    .list-item { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .notif { padding: 12px; border-radius: 8px; margin-bottom: 15px; display: none; }
    .notif.success { background: rgba(16,185,129,0.2); color: #10b981; display: block; }
    .notif.error { background: rgba(239,68,68,0.2); color: #ef4444; display: block; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Modulos Dashboard</h2>
    <div id="notif" class="notif"></div>
    
    <div id="loginBox">
      <h3>Admin Login</h3>
      <input type="text" id="u" placeholder="Username">
      <input type="password" id="p" placeholder="Password">
      <button onclick="doLogin()" id="loginBtn">Sign In</button>
    </div>

    <div id="dashboardBox" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>Add Business</h3>
        <button onclick="logout()" style="background: #ef4444; padding: 8px 12px; font-size: 0.8rem;">Logout</button>
      </div>
      
      <input type="text" id="bId" placeholder="Business ID (e.g. 12345)">
      <input type="text" id="bName" placeholder="Business Name">
      <input type="text" id="bPhone" placeholder="Phone Number">
      <button onclick="addBusiness()" id="saveBtn">Save Business</button>
      
      <h3 style="margin-top: 20px;">Registered Businesses</h3>
      <div id="list"></div>
    </div>
  </div>

  <script>
    let dbData = null;
    let config = null;

    // JSON fetch function
    async function fetchJSON(path) {
      const res = await fetch(`../../datas/${path}?t=` + Date.now());
      if (!res.ok) throw new Error('File not found');
      return await res.json();
    }

    // Start: Load Database
    async function init() {
      try {
        dbData = await fetchJSON('database.json');
        config = dbData.admin;
      } catch (e) {
        showNotif('error', 'database.json not found! Please create it in datas folder.');
      }
    }
    init();

    function doLogin() {
      const u = document.getElementById('u').value;
      const p = document.getElementById('p').value;

      if (!config) return showNotif('error', 'Database not loaded.');

      if (u === config.username && p === config.password) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('dashboardBox').style.display = 'block';
        renderList();
      } else {
        showNotif('error', 'Invalid credentials');
      }
    }

    async function addBusiness() {
      const id = document.getElementById('bId').value.trim();
      const name = document.getElementById('bName').value.trim();
      const phone = document.getElementById('bPhone').value.trim();

      if (!id || !name) return showNotif('error', 'ID and Name required');
      if (!config.github_token) return showNotif('error', 'GitHub Token missing in database.json');

      const btn = document.getElementById('saveBtn');
      btn.innerText = 'Saving...'; btn.disabled = true;

      const newBusiness = { businessId: id, businessName: name, phone: phone, createdAt: new Date().toISOString() };

      try {
        // 1. Get latest file SHA from GitHub
        const getUrl = `https://api.github.com/repos/${config.github_owner}/${config.github_repo}/contents/datas/database.json`;
        const getRes = await fetch(getUrl, {
          headers: { 'Authorization': `token ${config.github_token}` }
        });
        const getData = await getRes.json();
        
        // 2. Update data
        dbData.businesses.push(newBusiness);
        const newContent = btoa(unescape(encodeURIComponent(JSON.stringify(dbData, null, 2))));

        // 3. Push to GitHub
        const putRes = await fetch(getUrl, {
          method: 'PUT',
          headers: { 
            'Authorization': `token ${config.github_token}`,
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify({
            message: `Added business ${name}`,
            content: newContent,
            sha: getData.sha
          })
        });

        if (!putRes.ok) throw new Error('Failed to save to GitHub');

        showNotif('success', 'Business saved successfully to GitHub!');
        renderList();
        
        // Clear form
        document.getElementById('bId').value = '';
        document.getElementById('bName').value = '';
        document.getElementById('bPhone').value = '';

      } catch (err) {
        showNotif('error', 'Error: ' + err.message);
      } finally {
        btn.innerText = 'Save Business'; btn.disabled = false;
      }
    }

    function renderList() {
      const list = document.getElementById('list');
      if (!dbData || !dbData.businesses || dbData.businesses.length === 0) {
        list.innerHTML = '<p style="color:#94a3b8;">No businesses yet.</p>';
        return;
      }
      list.innerHTML = dbData.businesses.map(b => `
        <div class="list-item">
          <div><strong>${b.businessName}</strong> (ID: ${b.businessId})</div>
        </div>
      `).join('');
    }

    function logout() {
      location.reload();
    }

    function showNotif(type, msg) {
      const n = document.getElementById('notif');
      n.className = `notif ${type}`;
      n.innerText = msg;
      setTimeout(() => n.style.display = 'none', 5000);
    }
  </script>
</body>
</html>
