name: Modulos Master Backend

on:
  workflow_dispatch: # Manual test ke liye button
  repository_dispatch:
    types: [modulos-action]

# 🔒 CONCURRENCY LOCK: Ek time par sirf ek run hoga. Naya aayega toh purana kill ho jayega.
concurrency:
  group: modulos-master-lock
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  handle_all_actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GMT }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Payload Data
        id: payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          if [ -z "$PAYLOAD" ] || [ "$PAYLOAD" == "null" ]; then
            echo "Manual test run detected. No payload."
            echo "action=test" >> $GITHUB_OUTPUT
            echo "req_id=test-manual" >> $GITHUB_OUTPUT
          else
            echo "$PAYLOAD" > /tmp/payload.json
            ACTION=$(node -e "console.log(require('/tmp/payload.json').action || '')")
            REQ_ID=$(node -e "console.log(require('/tmp/payload.json').request_id || '')")
            echo "action=$ACTION" >> $GITHUB_OUTPUT
            echo "req_id=$REQ_ID" >> $GITHUB_OUTPUT
          fi

      - name: Ensure Folders Exist
        run: |
          mkdir -p datas/results
          mkdir -p scripts
          mkdir -p templates

      - name: Execute Backend Logic
        id: handler
        env:
          ACTION: ${{ steps.payload.outputs.action }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          if [ "$ACTION" == "test" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "message=Manual Test Successful" >> $GITHUB_OUTPUT
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            # Agar helpers.js file nahi mili toh error nahi dega, bas fail ho jayega
            node scripts/helpers.js "$ACTION"
          fi

      - name: Commit Changes to Database
        if: steps.handler.outputs.changed == 'true'
        run: |
          git config user.name "Modulos Bot"
          git config user.email "bot@modulos.in"
          git add datas/ nfcbusinesscp/
          git commit -m "Modulos: ${{ steps.payload.outputs.action }} — ${{ steps.payload.outputs.req_id }}" || echo "No changes to commit"
          git push

      - name: Write Result Log
        if: always() && steps.payload.outputs.action != 'test'
        env:
          REQ_ID: ${{ steps.payload.outputs.req_id }}
          SUCCESS: ${{ steps.handler.outputs.success }}
          MESSAGE: ${{ steps.handler.outputs.message }}
          TOKEN: ${{ steps.handler.outputs.token }}
          EXPIRES: ${{ steps.handler.outputs.expires }}
        run: |
          if [ "$SUCCESS" = "true" ]; then
            node -e "
              const fs = require('fs');
              const result = { success: true, message: process.env.MESSAGE || 'OK', token: process.env.TOKEN || '', expires: process.env.EXPIRES || '0', timestamp: Date.now() };
              fs.writeFileSync('datas/results/' + process.env.REQ_ID + '.json', JSON.stringify(result));
            "
          else
            node -e "
              const fs = require('fs');
              const result = { success: false, error: process.env.MESSAGE || 'Operation failed', timestamp: Date.now() };
              fs.writeFileSync('datas/results/' + process.env.REQ_ID + '.json', JSON.stringify(result));
            "
          fi

      - name: Commit Result
        if: always() && steps.payload.outputs.action != 'test'
        run: |
          git config user.name "Modulos Bot"
          git config user.email "bot@modulos.in"
          git add datas/results/
          git commit -m "Result: ${{ steps.payload.outputs.req_id }}" || echo "No result to commit"
          git push || true
