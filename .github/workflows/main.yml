name: Modulos Backend

on:
  workflow_dispatch: # Manual Run button ke liye
  repository_dispatch:
    types: [modulos-action]

# Force Kill Lock: Ek time par sirf ek run chalega
concurrency:
  group: modulos-lock
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  process_request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GMT }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Payload from Issue (Hidden Method)
        id: payload
        env:
          GH_TOKEN: ${{ secrets.GMT }}
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "${{ toJSON(github.event.client_payload) }}" > /tmp/payload.json
            ISSUE_NUM="${{ github.event.client_payload.issueNumber }}"
          else
            # Agar manual run hai, toh issue number 0
            echo '{"action":"test"}' > /tmp/payload.json
            ISSUE_NUM="0"
          fi
          
          ACTION=$(node -e "console.log(require('/tmp/payload.json').action || '')")
          REQ_ID=$(node -e "console.log(require('/tmp/payload.json').request_id || '')")
          
          echo "action=$ACTION" >> $GITHUB_OUTPUT
          echo "req_id=$REQ_ID" >> $GITHUB_OUTPUT
          echo "issue_num=$ISSUE_NUM" >> $GITHUB_OUTPUT

      - name: Execute Backend Logic
        id: handler
        env:
          ACTION: ${{ steps.payload.outputs.action }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: |
          if [ "$ACTION" == "test" ]; then
            echo "success=true" >> $GITHUB_OUTPUT
            echo "message=Manual Test Successful" >> $GITHUB_OUTPUT
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            node scripts/helpers.js "$ACTION"
          fi

      - name: Commit Changes to Database
        if: steps.handler.outputs.changed == 'true'
        run: |
          git config user.name "Modulos Bot"
          git config user.email "bot@modulos.in"
          git add datas/ nfcbusinesscp/
          git commit -m "Modulos: ${{ steps.payload.outputs.action }} — ${{ steps.payload.outputs.req_id }}" || echo "No changes"
          git push

      - name: Send Result to Dashboard via Issue Comment
        if: always() && steps.payload.outputs.issue_num != '0'
        env:
          GH_TOKEN: ${{ secrets.GMT }}
          SUCCESS: ${{ steps.handler.outputs.success }}
          MESSAGE: ${{ steps.handler.outputs.message }}
          TOKEN: ${{ steps.handler.outputs.token }}
          EXPIRES: ${{ steps.handler.outputs.expires }}
          ISSUE_NUM: ${{ steps.payload.outputs.issue_num }}
        run: |
          RESULT_JSON=$(node -e "
            const result = {
              success: process.env.SUCCESS === 'true',
              message: process.env.MESSAGE || '',
              token: process.env.TOKEN || '',
              expires: process.env.EXPIRES || '0',
              timestamp: Date.now()
            };
            console.log(JSON.stringify(result));
          ")
          gh issue comment $ISSUE_NUM --body "\`\`\`json\n$RESULT_JSON\n\`\`\`"
          gh issue close $ISSUE_NUM
