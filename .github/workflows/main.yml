name: Modulos Server

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  process_request:
    if: contains(github.event.issue.title, '[MODULOS-API]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GMT }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read Request
        id: req
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "$ISSUE_BODY" > /tmp/payload.json
          ACTION=$(node -e "try{console.log(require('/tmp/payload.json').action || '')}catch(e){console.log('')}")
          REQ_ID=$(node -e "try{console.log(require('/tmp/payload.json').request_id || '')}catch(e){console.log('')}")
          echo "action=$ACTION" >> $GITHUB_OUTPUT
          echo "req_id=$REQ_ID" >> $GITHUB_OUTPUT

      - name: Run Server Logic (helpers.js)
        id: server
        env:
          ACTION: ${{ steps.req.outputs.action }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
        run: node scripts/helpers.js "$ACTION"

      - name: Send Response & Close Issue
        if: always()
        uses: actions/github-script@v7
        env:
          SUCCESS: ${{ steps.server.outputs.success }}
          MESSAGE: ${{ steps.server.outputs.message }}
          TOKEN: ${{ steps.server.outputs.token }}
          EXPIRES: ${{ steps.server.outputs.expires }}
        with:
          script: |
            const result = {
              success: process.env.SUCCESS === 'true',
              message: process.env.MESSAGE || '',
              token: process.env.TOKEN || '',
              expires: process.env.EXPIRES || '0'
            };
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '```json\n' + JSON.stringify(result, null, 2) + '\n```'
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed'
            });

      - name: Commit DB Changes
        if: steps.server.outputs.changed == 'true'
        run: |
          git config user.name "Modulos Bot"
          git config user.email "bot@modulos.in"
          git add datas/ nfcbusinesscp/
          git commit -m "Update from ${{ steps.req.outputs.action }}" || echo "No changes"
          git push
